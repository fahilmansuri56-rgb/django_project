{% extends 'base.html' %}

{% block title %}Login - ExpenseWise{% endblock %}

{% block content %}
<div class="form-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <span style="font-size: 2.5rem;">🔐</span>
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-top: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Log in to manage your budget and track expenses</p>
    </div>

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="id_username">Username</label>
            <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="id_password">Password</label>
            <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
            Sign In to Dashboard
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one here</a>
    </div>
</div>
{% endblock %}
